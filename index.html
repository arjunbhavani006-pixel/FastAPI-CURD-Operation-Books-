
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book CRUD Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f5fb;
            color: #202b3c;
            padding: 30px 16px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            background: #243b80;
            color: white;
            padding: 28px;
            border-radius: 16px;
            margin-bottom: 24px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            color: #e0e7ff;
            line-height: 1.5;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 22px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 5px 20px #182b4b0d;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin: 13px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd4e2;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #3659bd;
        }

        .buttons {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 15px;
            cursor: pointer;
            color: white;
            background: #3155b5;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.88;
        }

        .secondary {
            background: #64748b;
        }

        .danger {
            background: #d33c4b;
        }

        .success {
            background: #16835d;
        }

        #message {
            margin: 18px 0;
            padding: 12px;
            border-radius: 8px;
            display: none;
            overflow-wrap: anywhere;
        }

        #message.ok {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        #message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .books-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .book-list {
            display: grid;
            gap: 12px;
        }

        .book {
            border: 1px solid #e0e6f0;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
        }

        .book h3 {
            margin-bottom: 7px;
            overflow-wrap: anywhere;
        }

        .book p {
            color: #64748b;
            margin-top: 5px;
            font-size: 14px;
        }

        .book-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .book-actions button {
            padding: 8px 10px;
            font-size: 12px;
        }

        .empty {
            color: #64748b;
            padding: 15px 0;
        }

        footer {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .book {
                align-items: flex-start;
                flex-direction: column;
            }

            header {
                padding: 22px;
            }

            .books-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <header>
        <h1>📚 Book CRUD Manager</h1>
        <p>Add, view, search, update and delete books using FastAPI.</p>
    </header>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="layout">

        <section class="card">
            <h2 id="formTitle">➕ Add a Book</h2>

            <form id="bookForm">
                <label for="title">Book Title</label>
                <input id="title" type="text"
                       placeholder="Enter book title" required>

                <label for="author">Author Name</label>
                <input id="author" type="text"
                       placeholder="Enter author name" required>

                <label for="price">Price (₹)</label>
                <input id="price" type="number"
                       min="0" step="0.01"
                       placeholder="Enter price" required>

                <div class="buttons">
                    <button type="submit" id="submitBtn">
                        Add Book
                    </button>
                    <button type="button" class="secondary"
                            id="cancelBtn" hidden>
                        Cancel Edit
                    </button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>🔎 Find a Book</h2>

            <label for="searchId">Book ID</label>
            <input id="searchId" type="number" min="1"
                   placeholder="Enter Book ID">

            <div class="buttons">
                <button type="button" id="searchBtn">
                    Search Book
                </button>
                <button type="button" class="secondary"
                        id="showAllBtn">
                    Show All
                </button>
            </div>

            <p style="margin-top:18px;color:#64748b;font-size:14px;">
                To edit a book, click its Edit button in the list.
            </p>
        </section>

    </div>

    <section class="card">
        <div class="books-header">
            <h2>📖 All Books</h2>
            <button type="button" class="success"
                    id="refreshBtn">
                Refresh List
            </button>
        </div>

        <div id="bookList" class="book-list">
            <p class="empty">Loading books...</p>
        </div>
    </section>

    <footer>
        Book CRUD Manager · HTML, CSS, JavaScript and FastAPI
    </footer>

</div>

<script>
    // The frontend and API are served from the same FastAPI server.
    const API_URL = "/books";

    const form = document.getElementById("bookForm");
    const titleInput = document.getElementById("title");
    const authorInput = document.getElementById("author");
    const priceInput = document.getElementById("price");
    const bookList = document.getElementById("bookList");
    const message = document.getElementById("message");
    const formTitle = document.getElementById("formTitle");
    const submitBtn = document.getElementById("submitBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    let editingId = null;

    function showMessage(text, type = "ok") {
        message.textContent = text;
        message.className = type;
    }

    function clearMessage() {
        message.textContent = "";
        message.className = "";
    }

    async function apiRequest(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            headers: {
                "Content-Type": "application/json",
                ...(options.headers || {})
            }
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                data.detail || "Request failed. Please try again."
            );
        }

        return data;
    }

    function resetForm() {
        editingId = null;
        form.reset();
        formTitle.textContent = "➕ Add a Book";
        submitBtn.textContent = "Add Book";
        cancelBtn.hidden = true;
    }

    async function loadBooks() {
        try {
            const books = await apiRequest(API_URL);
            renderBooks(books);
        } catch (error) {
            bookList.replaceChildren();
            const p = document.createElement("p");
            p.className = "empty";
            p.textContent = "Could not load books: " + error.message;
            bookList.appendChild(p);
        }
    }

    function renderBooks(books) {
        bookList.replaceChildren();

        if (!books.length) {
            const p = document.createElement("p");
            p.className = "empty";
            p.textContent = "No books found. Add your first book!";
            bookList.appendChild(p);
            return;
        }

        books.forEach(book => {
            const item = document.createElement("article");
            item.className = "book";

            const details = document.createElement("div");
            const heading = document.createElement("h3");
            heading.textContent = "#" + book.id + " · " + book.title;

            const author = document.createElement("p");
            author.textContent = "Author: " + book.author;

            const price = document.createElement("p");
            price.textContent = "Price: ₹" +
                Number(book.price).toFixed(2);

            details.append(heading, author, price);

            const actions = document.createElement("div");
            actions.className = "book-actions";

            const editBtn = document.createElement("button");
            editBtn.textContent = "Edit";
            editBtn.addEventListener("click", () => editBook(book));

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.className = "danger";
            deleteBtn.addEventListener("click", () => deleteBook(book.id));

            actions.append(editBtn, deleteBtn);
            item.append(details, actions);
            bookList.appendChild(item);
        });
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();
        clearMessage();

        const book = {
            title: titleInput.value.trim(),
            author: authorInput.value.trim(),
            price: Number(priceInput.value)
        };

        if (!book.title || !book.author || priceInput.value === "") {
            showMessage("Please fill in all fields.", "error");
            return;
        }

        if (!Number.isFinite(book.price) || book.price < 0) {
            showMessage("Enter a valid price.", "error");
            return;
        }

        try {
            if (editingId === null) {
                const result = await apiRequest(API_URL, {
                    method: "POST",
                    body: JSON.stringify(book)
                });
                showMessage(result.message || "Book added successfully.");
            } else {
                const result = await apiRequest(
                    `${API_URL}/${editingId}`,
                    {
                        method: "PUT",
                        body: JSON.stringify(book)
                    }
                );
                showMessage(result.message || "Book updated successfully.");
            }

            resetForm();
            await loadBooks();
        } catch (error) {
            showMessage(error.message, "error");
        }
    });

    function editBook(book) {
        editingId = book.id;
        titleInput.value = book.title;
        authorInput.value = book.author;
        priceInput.value = book.price;

        formTitle.textContent = "✏️ Edit Book #" + book.id;
        submitBtn.textContent = "Save Changes";
        cancelBtn.hidden = false;

        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    cancelBtn.addEventListener("click", () => {
        resetForm();
        clearMessage();
    });

    async function deleteBook(id) {
        if (!confirm("Are you sure you want to delete Book #" + id + "?")) {
            return;
        }

        try {
            const result = await apiRequest(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            if (editingId === id) {
                resetForm();
            }

            showMessage(result.message || "Book deleted successfully.");
            await loadBooks();
        } catch (error) {
            showMessage(error.message, "error");
        }
    }

    document.getElementById("searchBtn").addEventListener("click", async () => {
        clearMessage();
        const id = document.getElementById("searchId").value.trim();

        if (!id || !Number.isInteger(Number(id)) || Number(id) < 1) {
            showMessage("Please enter a valid Book ID.", "error");
            return;
        }

        try {
            const book = await apiRequest(`${API_URL}/${id}`);
            renderBooks([book]);
            showMessage("Book found successfully.");
        } catch (error) {
            renderBooks([]);
            showMessage(error.message, "error");
        }
    });

    document.getElementById("showAllBtn").addEventListener("click", () => {
        document.getElementById("searchId").value = "";
        clearMessage();
        loadBooks();
    });

    document.getElementById("refreshBtn").addEventListener("click", () => {
        clearMessage();
        loadBooks();
    });

    // Load existing books when the page opens.
    loadBooks();
</script>
</body>
</html>
